services:
  dwellmind-ha:
    image: ghcr.io/spikked27/dwell-mind-ha:edge
    container_name: dwellmind-ha
    read_only: true
    restart: "no"
    stop_grace_period: 20s
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 2.0
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SERVICE_PORT:-8128}:8128"
    environment:
      RUN_MODE: service
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
    volumes:
      - "${APPDATA:-./appdata}:/data:rw"
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
