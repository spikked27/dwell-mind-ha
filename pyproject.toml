[project]
name = "dwell-mind-ha"
version = "0.1.0a1"
description = "Local-first room observation and experimental routine learning for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "DwellMind HA contributors"}]
dependencies = []

[project.optional-dependencies]
live-observer = ["websocket-client==1.9.2"]

[project.urls]
Homepage = "https://github.com/spikked27/dwell-mind-ha"
Issues = "https://github.com/spikked27/dwell-mind-ha/issues"

[tool.ruff]
target-version = "py313"
line-length = 120
