start_capture:
  name: Start bounded observation capture
  description: Observe the reviewed rooms and entities for up to 24 hours. Never controls home devices.
  fields:
    duration_seconds:
      name: Duration
      required: true
      example: 86400
      selector:
        number:
          min: 10
          max: 86400
          mode: box
          unit_of_measurement: s
    entry_id:
      name: Integration entry ID
      description: Required only when more than one DwellMind worker is loaded.
      selector:
        text:
train_temperature_forecast:
  name: Train historical temperature forecast
  description: Read hourly statistics for one reviewed sensor and train on Unraid with a move boundary and held-out evaluation. Never changes HVAC settings.
  fields:
    entity_id:
      name: Reviewed temperature sensor
      required: true
      selector:
        entity:
          domain: sensor
          device_class: temperature
    start_date:
      name: Archive start date
      required: true
      example: "2023-10-08"
      selector:
        date:
    move_date:
      name: Move date
      required: true
      example: "2026-03-20"
      selector:
        date:
    entry_id:
      name: Integration entry ID
      description: Required only when more than one DwellMind worker is loaded.
      selector:
        text:

start_shadow_campaign:
  name: Start full shadow learning campaign
  description: Train and evaluate predictions for reviewed occupancy, lighting, climate, curtains and ventilation. Never executes device actions.
  fields:
    move_date:
      name: Move date
      required: true
      selector:
        date:
    days:
      name: Campaign duration
      default: 14
      selector:
        number:
          min: 1
          max: 30
          mode: box
    entry_id:
      name: Integration entry ID
      selector:
        text:
stop_shadow_campaign:
  name: Stop shadow learning campaign
  description: Stop predictions and automatic campaign capture renewal. Preserve all sources, models and logs. Separate existing observation automations remain unchanged.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
