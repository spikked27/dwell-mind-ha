name: Tests and container smoke check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements-live.txt"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/check_release.py
  docker-smoke:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t dwellmind-ha:test .
      - run: docker compose config --quiet
        env:
          HA_URL: https://ha.example.invalid
      - run: bash scripts/container_smoke.sh
  ha-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.4
      - run: python -m unittest discover -s integration_tests -v
